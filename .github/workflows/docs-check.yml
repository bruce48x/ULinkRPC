name: Docs Check

on:
  push:
    branches:
      - main
    paths:
      - blog/**
      - README.md
      - README.zh-CN.md
      - CONTRIBUTING.md
      - scripts/check-docs-consistency.ps1
  pull_request:
    paths:
      - blog/**
      - README.md
      - README.zh-CN.md
      - CONTRIBUTING.md
      - scripts/check-docs-consistency.ps1
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Hugo
        run: |
          set -eux
          HUGO_VERSION="0.147.0"
          ARCHIVE="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL -o "$ARCHIVE" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${ARCHIVE}"
          sudo tar -C /usr/local/bin -xzf "$ARCHIVE" hugo
          hugo version

      - name: Check docs consistency
        run: pwsh -NoProfile -File scripts/check-docs-consistency.ps1

      - name: Build Hugo site
        working-directory: blog
        run: hugo --printPathWarnings
